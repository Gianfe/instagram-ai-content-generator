[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-ai-content-generator"
version = "0.1.0"
description = "Minimal Python client for publishing a test Instagram post via the Graph API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
